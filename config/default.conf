server {
    listen 127.0.0.1:8083;
    error_page 404 ./error_pages/404.html;
    client_max_body_size 4;

    location / {
        allow_methods GET;
        #return 302 /sgoinfre/students/ataan/webserv/chicken.jpeg;
        root /home/ataan/webserv/restFulQuack;
        upload_store /home/ataan/webserv/restFulQuack/uploads;
        autoindex on;
        #index index.html;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        root /home/ataan/webserv/restFulQuack/uploads;
        upload_store /home/ataan/webserv/restFulQuack/uploads;
        autoindex on;
        #index index.html;
    }

#    location /sgoinfre/students/ataan/webserv {
 #       allow_methods GET POST ;
